      <stop offset="1" stop-color="#22b3a6"/>
    </radialGradient>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="scale" values="1 1; 1.04 0.96; 1 1" additive="sum" dur="2.2s" repeatCount="indefinite"/>
