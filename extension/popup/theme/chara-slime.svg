    <ellipse cx="44" cy="62" rx="5" ry="7" fill="#1b3d3a"/>
    <ellipse cx="76" cy="62" rx="5" ry="7" fill="#1b3d3a"/>
    <circle cx="42" cy="59" r="1.8" fill="#fff"/>
    <circle cx="74" cy="59" r="1.8" fill="#fff"/>
    <!-- 볼 -->
    <ellipse cx="32" cy="72" rx="6" ry="3.5" fill="#ff9fb8" opacity="0.7"/>
    <ellipse cx="88" cy="72" rx="6" ry="3.5" fill="#ff9fb8" opacity="0.7"/>
    <!-- 입 -->
    <path d="M56 74 q4 5 8 0" stroke="#1b3d3a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
