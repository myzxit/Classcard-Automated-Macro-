name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 기본값은 'tools platform-tools' 인데, 구글이 SDK 저장소에서 'tools' 를
          # 없앴다. 그래서 sdkmanager 가 "Failed to find package 'tools'" 로 죽는다.
          # 러너 이미지에 SDK 는 이미 들어 있으므로 platform-tools 만 맞춰 준다.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # ---------------------------------------------------------- 확장프로그램
      # 이식 정확성 회귀 테스트 — 원본 파이썬 구현의 출력과 대조한다.
      - name: Extension parity tests
        run: node extension/test/parity.test.mjs

      # 파일을 직접 지정한다 (node 20 의 --test 는 glob 을 풀지 못한다)
      - name: Extension unit tests
        run: node --test extension/test/grammar.test.mjs

      # 아이폰 번들과 PC 앱 복사본이 깨지지 않았는지 (둘 다 같은 엔진을 묶는다)
      - name: iOS bundle / desktop sync
        run: |
          node ios/build.mjs
          node desktop/sync.mjs

      - name: Package extension
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/classcard-automation-extension.zip . \
            -x 'test/*' -x '*.DS_Store'
          cd ..
          ls -la dist

      # ---------------------------------------------------------- 안드로이드
      # 같은 reference.json 으로 코틀린 이식본도 검증한다.
      - name: Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk dist/classcard-automation.apk

      # ---------------------------------------------------------- 배포
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: classcard-automation-builds
          path: |
            dist/classcard-automation.apk
            dist/classcard-automation-extension.zip
          if-no-files-found: error

      # 폰/PC에서 바로 받을 수 있도록 고정 링크의 Release 로도 올린다.
      # APK:  .../releases/download/apk-latest/classcard-automation.apk
      # 확장: .../releases/download/apk-latest/classcard-automation-extension.zip
      - name: Publish to rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-latest"
          NOTES="브랜치 \`${GITHUB_REF_NAME}\` / 커밋 \`${GITHUB_SHA:0:7}\` 에서 자동 빌드되었습니다.

          **📱 안드로이드** — \`classcard-automation.apk\` 를 휴대폰 브라우저로 눌러 받으면 바로 설치됩니다.
          (설치 시 '출처를 알 수 없는 앱' 허용이 필요합니다.)

          **🧩 크롬 확장프로그램** — \`classcard-automation-extension.zip\` 을 받아 압축을 풀고,
          \`chrome://extensions\` → 개발자 모드 → '압축해제된 확장 프로그램을 로드합니다' 로 폴더를 선택하세요.

          **💻 PC(윈도우)** — \`classcard-automation-portable.exe\` 를 받아 바로 실행하세요 (설치판: \`classcard-automation-setup.exe\`).
          SmartScreen 경고가 뜨면 '추가 정보 → 실행'. (윈도우 빌드는 몇 분 뒤에 올라옵니다)

          **📱 아이폰** — 저장소의 \`ios/README.md\` 를 보세요 (북마클릿)."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" \
              --title "클래스카드 자동화 (최신 빌드)" \
              --notes "$NOTES" \
              --prerelease
          fi
          gh release upload "$TAG" \
            dist/classcard-automation.apk \
            dist/classcard-automation-extension.zip --clobber

          {
            echo "### 다운로드"
            echo ""
            echo "- 📱 APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/classcard-automation.apk"
            echo "- 🧩 확장: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/classcard-automation-extension.zip"
            echo "- 💻 PC: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/classcard-automation-portable.exe"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  # ---------------------------------------------------------- PC(윈도우 exe)
  # 확장·안드로이드와 같은 엔진을 Electron 으로 감싼 것. exe 는 윈도우 러너에서만 만들 수 있다.
  desktop-windows:
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build exe (portable + installer)
        working-directory: desktop
        run: npm run dist:win

      - name: List
        shell: bash
        run: ls -la desktop/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: classcard-automation-desktop
          path: |
            desktop/dist/classcard-automation-portable.exe
            desktop/dist/classcard-automation-setup.exe
            desktop/dist/latest.yml
          if-no-files-found: error

      # 자동 업데이트용 version.json — 모든 클라이언트가 이 파일을 보고 새 버전을 안다.
      # APK·확장 zip(build 잡)과 exe 가 전부 올라간 **맨 마지막**에 올린다.
      # (먼저 올리면 새 버전 안내를 보고 받은 파일이 아직 옛것일 수 있다)
      - name: Make version.json
        shell: bash
        run: node tools/make_version.mjs desktop/dist/version.json

      # 같은 고정 릴리스에 exe 도 올린다 (build 잡이 릴리스를 먼저 만든다)
      # latest.yml 은 electron-builder 가 만드는 자동 업데이트 설명 파일(PC 앱의 electron-updater 가 읽는다).
      - name: Publish to rolling release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls desktop/dist
          gh release upload "apk-latest" \
            desktop/dist/classcard-automation-portable.exe \
            desktop/dist/classcard-automation-setup.exe \
            desktop/dist/latest.yml --clobber
          gh release upload "apk-latest" desktop/dist/version.json --clobber
          echo "- 💻 PC: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/classcard-automation-portable.exe" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------- 모의 화면 회귀 (확장 + 크로미움)
  # 실제 사이트 규칙을 흉내 낸 21종의 화면에서 각 모드가 끝까지 도는지 본다. 산출물 배포와는 독립이다.
  mocks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        working-directory: tools/verify
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56
          npx playwright install --with-deps chromium

      - name: Run mock suite
        run: bash tools/verify/run.sh

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-suite-result
          path: tools/verify/last_result.txt
          if-no-files-found: ignore
