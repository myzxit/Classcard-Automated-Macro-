name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # ---------------------------------------------------------- 확장프로그램
      # 이식 정확성 회귀 테스트 — 원본 파이썬 구현의 출력과 대조한다.
      - name: Extension parity tests
        run: node extension/test/parity.test.mjs

      - name: Package extension
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/classcard-automation-extension.zip . \
            -x 'test/*' -x '*.DS_Store'
          cd ..
          ls -la dist

      # ---------------------------------------------------------- 안드로이드
      # 같은 reference.json 으로 코틀린 이식본도 검증한다.
      - name: Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk dist/classcard-automation.apk

      # ---------------------------------------------------------- 배포
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: classcard-automation-builds
          path: |
            dist/classcard-automation.apk
            dist/classcard-automation-extension.zip
          if-no-files-found: error

      # 폰/PC에서 바로 받을 수 있도록 고정 링크의 Release 로도 올린다.
      # APK:  .../releases/download/apk-latest/classcard-automation.apk
      # 확장: .../releases/download/apk-latest/classcard-automation-extension.zip
      - name: Publish to rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-latest"
          NOTES="브랜치 \`${GITHUB_REF_NAME}\` / 커밋 \`${GITHUB_SHA:0:7}\` 에서 자동 빌드되었습니다.

          **📱 안드로이드** — \`classcard-automation.apk\` 를 휴대폰 브라우저로 눌러 받으면 바로 설치됩니다.
          (설치 시 '출처를 알 수 없는 앱' 허용이 필요합니다.)

          **🧩 크롬 확장프로그램** — \`classcard-automation-extension.zip\` 을 받아 압축을 풀고,
          \`chrome://extensions\` → 개발자 모드 → '압축해제된 확장 프로그램을 로드합니다' 로 폴더를 선택하세요."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" \
              --title "클래스카드 자동화 (최신 빌드)" \
              --notes "$NOTES" \
              --prerelease
          fi
          gh release upload "$TAG" \
            dist/classcard-automation.apk \
            dist/classcard-automation-extension.zip --clobber

          {
            echo "### 다운로드"
            echo ""
            echo "- 📱 APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/classcard-automation.apk"
            echo "- 🧩 확장: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/classcard-automation-extension.zip"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
