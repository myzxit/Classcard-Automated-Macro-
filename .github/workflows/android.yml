name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # 이식 정확성 회귀 테스트 — 원본 파이썬 구현의 출력과 대조한다.
      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             dist/classcard-automation.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: classcard-automation-debug-apk
          path: dist/classcard-automation.apk
          if-no-files-found: error

      # 폰에서 바로 받을 수 있도록 고정 링크의 Release 로도 올린다.
      # (Actions 아티팩트는 zip 이고 로그인이 필요해서 휴대폰에서 받기 불편하다)
      # 링크: .../releases/download/apk-latest/classcard-automation.apk
      - name: Publish APK to rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-latest"
          NOTES="브랜치 \`${GITHUB_REF_NAME}\` / 커밋 \`${GITHUB_SHA:0:7}\` 에서 자동 빌드된 APK입니다.

          아래 **classcard-automation.apk** 를 휴대폰 브라우저로 눌러 받으면 바로 설치할 수 있습니다.
          (설치 시 '출처를 알 수 없는 앱' 허용이 필요합니다.)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" \
              --title "클래스카드 자동화 APK (최신 빌드)" \
              --notes "$NOTES" \
              --prerelease
          fi
          gh release upload "$TAG" dist/classcard-automation.apk --clobber

          echo "### 📱 APK 다운로드" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/classcard-automation.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
